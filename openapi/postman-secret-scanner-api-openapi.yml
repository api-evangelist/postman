openapi: 3.2.0
info:
  title: Postman APIs API Comments Secret Scanner API
  description: 'The Postman APIs API enables you to manage your API definitions in Postman''s

    API Builder. You can create APIs, manage versions, add schemas (OpenAPI,

    GraphQL, etc.), and link collections, environments, mock servers, monitors,

    and documentation to your API definitions.


    ## Authentication

    All requests require an API key passed in the `x-api-key` header.


    ## Rate Limits

    Standard Postman API rate limits apply.'
  version: 1.0.0
  contact:
    name: Postman Developer Support
    url: https://learning.postman.com/docs/developer/postman-api/intro-api/
    email: help@postman.com
  license:
    name: Postman Terms of Service
    url: https://www.postman.com/legal/terms/
servers:
- url: https://api.getpostman.com
  description: Postman Production API Server
security:
- apiKeyAuth: []
tags:
- name: Secret Scanner
  description: Operations for managing detected secrets and leaked credentials.
paths:
  /secret-scanner/detected-secrets:
    get:
      tags:
      - Secret Scanner
      summary: Postman Get detected secrets
      operationId: getDetectedSecrets
      description: Gets a list of secrets detected across your team's Postman entities (collections, environments, etc.). Returns secret metadata including the type of secret, where it was found, and its resolution status.
      parameters:
      - name: cursor
        in: query
        description: Pagination cursor for the next page.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return.
        schema:
          type: integer
          default: 25
          maximum: 50
      - name: since
        in: query
        description: Return secrets detected after this date (ISO 8601).
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Return secrets detected before this date (ISO 8601).
        schema:
          type: string
          format: date-time
      - name: statuses
        in: query
        description: Filter by resolution status (comma-separated).
        schema:
          type: string
          enum:
          - UNRESOLVED
          - RESOLVED_FALSE_POSITIVE
          - RESOLVED_REVOKED
          - RESOLVED_ACCEPTED_RISK
      - name: resourceTypes
        in: query
        description: Filter by resource type (comma-separated).
        schema:
          type: string
          enum:
          - collection
          - environment
          - api
          - request
          - example
          - folder
      - name: workspaceIds
        in: query
        description: Filter by workspace IDs (comma-separated).
        schema:
          type: string
      - name: secretTypes
        in: query
        description: Filter by secret type (comma-separated).
        schema:
          type: string
      responses:
        '200':
          description: Successful response with detected secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DetectedSecret'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      nextCursor:
                        type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /secret-scanner/detected-secrets/{secretId}:
    get:
      tags:
      - Secret Scanner
      summary: Postman Get a detected secret
      operationId: getDetectedSecret
      description: Gets detailed information about a specific detected secret, including where it was found and its resolution history.
      parameters:
      - $ref: '#/components/parameters/SecretIdParam'
      responses:
        '200':
          description: Successful response with secret details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DetectedSecretDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
    put:
      tags:
      - Secret Scanner
      summary: Postman Resolve a detected secret
      operationId: resolveDetectedSecret
      description: Updates the resolution status of a detected secret. You can mark it as revoked, a false positive, or an accepted risk.
      parameters:
      - $ref: '#/components/parameters/SecretIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - resolution
              properties:
                resolution:
                  type: string
                  enum:
                  - RESOLVED_FALSE_POSITIVE
                  - RESOLVED_REVOKED
                  - RESOLVED_ACCEPTED_RISK
                  description: The resolution status to set
      responses:
        '200':
          description: Successfully resolved secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DetectedSecret'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /secret-scanner/detected-secrets/{secretId}/locations:
    get:
      tags:
      - Secret Scanner
      summary: Postman Get locations of a detected secret
      operationId: getSecretLocations
      description: Gets all locations where a detected secret was found across your Postman entities.
      parameters:
      - $ref: '#/components/parameters/SecretIdParam'
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 25
          maximum: 50
      responses:
        '200':
          description: Successful response with secret locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecretLocation'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      nextCursor:
                        type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /secret-scanner/secret-types:
    get:
      tags:
      - Secret Scanner
      summary: Postman Get supported secret types
      operationId: getSecretTypes
      description: Gets a list of all secret types that the scanner can detect, including their names and descriptions.
      responses:
        '200':
          description: Successful response with secret types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecretType'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /detected-secrets-queries:
    post:
      operationId: detectedSecretsQueries
      summary: Search detected secrets
      description: Returns all secrets detected by Postman's Secret Scanner, grouped by workspace or resource. If you pass an empty request body, this endpoint returns all results.
      tags:
      - Secret Scanner
      parameters:
      - name: limit
        in: query
        description: The maximum number of rows to return in the response.
        required: false
        schema:
          $ref: '#/components/schemas/limit'
          default: 10
      - name: cursor
        in: query
        description: The pointer to the first record of the set of paginated results. To view the next response, use the `nextCursor` value for this parameter.
        required: false
        schema:
          $ref: '#/components/schemas/cursor'
      - name: include
        in: query
        description: 'The additional fields to be included as a part of the request:

          - `meta.total` — Include the total records found in the `meta` response object.

          '
        required: false
        schema:
          $ref: '#/components/schemas/include'
      - name: since
        in: query
        description: Return only results created since the given time, in [ISO 8601](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format. This value cannot be later than the `until` value. To use `time-numoffset` format, you must use `%2B` URL-encoding for the `+` character.
        required: false
        schema:
          $ref: '#/components/schemas/sinceDateTime'
      - name: until
        in: query
        description: Return only results created until this given time, in [ISO 8601](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format. This value cannot be earlier than the `since` value. To use `time-numoffset` format, you must use `%2B` URL-encoding for the `+` character.
        required: false
        schema:
          $ref: '#/components/schemas/untilDateTime'
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/detectedSecretsQueries'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectedSecretsQueriesRequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectedSecretsQueriesRequestForbiddenError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/detectedSecretsQueriesRequest'
  /detected-secrets/{secretId}:
    put:
      operationId: updateDetectedSecretResolutions
      summary: Update detected secret resolution status
      description: Updates the resolution status of a secret detected in a workspace.
      tags:
      - Secret Scanner
      parameters:
      - name: secretId
        in: path
        description: The secret's ID.
        required: true
        schema:
          $ref: '#/components/schemas/secretId'
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateSecretResolutions'
        '400':
          description: Invalid Resolution Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDetectedSecretResolutionsRequestForbiddenError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateSecretResolutionsRequest'
  /detected-secrets/{secretId}/locations:
    get:
      operationId: getDetectedSecretsLocations
      summary: Get detected secrets locations
      description: Gets the locations of secrets detected by Postman's Secret Scanner.
      tags:
      - Secret Scanner
      parameters:
      - name: secretId
        in: path
        description: The secret's ID.
        required: true
        schema:
          $ref: '#/components/schemas/secretId'
      - name: limit
        in: query
        description: The maximum number of rows to return in the response.
        required: false
        schema:
          $ref: '#/components/schemas/limit'
          default: 10
      - name: cursor
        in: query
        description: The pointer to the first record of the set of paginated results. To view the next response, use the `nextCursor` value for this parameter.
        required: false
        schema:
          $ref: '#/components/schemas/cursor'
      - name: workspaceId
        in: query
        description: The workspace's ID.
        required: true
        schema:
          $ref: '#/components/schemas/workspaceId'
      - name: since
        in: query
        description: Return only results created since the given time, in [ISO 8601](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format. This value cannot be later than the `until` value. To use `time-numoffset` format, you must use `%2B` URL-encoding for the `+` character.
        required: false
        schema:
          $ref: '#/components/schemas/sinceDateTime'
      - name: until
        in: query
        description: Return only results created until this given time, in [ISO 8601](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format. This value cannot be earlier than the `since` value. To use `time-numoffset` format, you must use `%2B` URL-encoding for the `+` character.
        required: false
        schema:
          $ref: '#/components/schemas/untilDateTime'
      - name: resourceType
        in: query
        description: Return only results that match the given resource type.
        required: false
        schema:
          $ref: '#/components/schemas/resourceType'
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getSecretsLocations'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDetectedSecretsLocationsRequestForbiddenError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
  /secret-types:
    get:
      operationId: getSecretTypes
      summary: Get secret types
      description: Gets the metadata of the secret types supported by Postman's Secret Scanner. You can use a secret type's ID in the response to query data with the POST `/detected-secrets/{secretId}` endpoint.
      tags:
      - Secret Scanner
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getSecretTypes'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSecretTypesRequestForbiddenError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
components:
  responses:
    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                  message:
                    type: string
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                  message:
                    type: string
    InternalServerError:
      description: An unexpected error occurred on the server
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                  message:
                    type: string
    UnauthorizedError:
      description: Authentication credentials are missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                  message:
                    type: string
    BadRequestError:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                  message:
                    type: string
    RateLimitError:
      description: Too many requests - rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
  schemas:
    SecretLocation:
      type: object
      description: A location where a secret was detected.
      properties:
        resourceType:
          type: string
          enum:
          - collection
          - environment
          - api
          - request
          - example
          - folder
          description: The type of resource containing the secret
        resourceId:
          type: string
          description: The resource's unique ID
        resourceName:
          type: string
          description: The resource name
        workspaceId:
          type: string
        parentResourceId:
          type: string
          description: The parent resource ID (e.g., collection ID for a request)
        isActive:
          type: boolean
          description: Whether the secret is still present at this location
        detectedAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: A link to the resource in Postman
    DetectedSecretDetail:
      type: object
      description: Detailed information about a detected secret.
      allOf:
      - $ref: '#/components/schemas/DetectedSecret'
      - type: object
        properties:
          secretHash:
            type: string
            description: A hash of the detected secret value (the actual value is not returned)
          occurrences:
            type: integer
            description: Number of locations where this secret was found
          resolutionHistory:
            type: array
            items:
              type: object
              properties:
                resolution:
                  type: string
                resolvedBy:
                  type: integer
                resolvedAt:
                  type: string
                  format: date-time
    DetectedSecret:
      type: object
      description: A secret detected by the Postman secret scanner.
      properties:
        secretId:
          type: string
          description: The detected secret's unique ID
        secretType:
          type: string
          description: The type of secret detected (e.g., AWS Access Key, GitHub Token)
        resolution:
          type: string
          enum:
          - UNRESOLVED
          - RESOLVED_FALSE_POSITIVE
          - RESOLVED_REVOKED
          - RESOLVED_ACCEPTED_RISK
          description: The resolution status of the secret
        workspaceId:
          type: string
          description: The workspace where the secret was found
        workspaceVisibility:
          type: string
          enum:
          - personal
          - team
          - private
          - public
          - partner
        detectedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        resolvedBy:
          type: integer
    SecretType:
      type: object
      description: A type of secret that the scanner can detect.
      properties:
        name:
          type: string
          description: The display name of the secret type
          example: AWS Access Key ID
        slug:
          type: string
          description: The machine-readable identifier
          example: aws-access-key-id
        description:
          type: string
          description: A description of the secret type
    detectedSecretsQueries:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/DetectedSecretsQueriesMeta'
          description: The response's meta information for paginated results.
        data:
          type: array
          items:
            $ref: '#/components/schemas/DetectedSecretsQueriesDataItems'
      title: detectedSecretsQueries
    DetectedSecretsQueriesRequestResourcesItemsType:
      type: string
      enum:
      - collection
      - environment
      - extensible-collection
      - globals
      - example
      - request
      - folder
      - extensible-collection-meta
      - extensible-request
      - extensible-folder
      - extensible-example
      - extensible-message
      description: The type of resource.
      title: DetectedSecretsQueriesRequestResourcesItemsType
    secretId:
      type: string
      title: secretId
    GetSecretTypesRequestForbiddenError:
      oneOf:
      - $ref: '#/components/schemas/commonErrorTypeTitleDetailStatus'
      - $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
      title: GetSecretTypesRequestForbiddenError
    UpdateSecretResolutionsHistoryItems:
      type: object
      properties:
        actor:
          type: number
          format: double
          description: The ID of the user that updated the secret's resolution status.
        createdAt:
          type: string
          format: date-time
          description: The date and time at which the resolution status was updated.
        resolution:
          $ref: '#/components/schemas/UpdateSecretResolutionsHistoryItemsResolution'
          description: 'The secret''s updated resolution status:

            - `ACTIVE` — The secret is active.

            - `FALSE_POSITIVE` — The discovered secret is not an actual secret.

            - `REVOKED` — The secret is valid, but the user rotated their key to resolve the issue.

            - `ACCEPTED_RISK` — The Secret Scanner found the secret, but user accepts the risk of publishing it.

            '
      title: UpdateSecretResolutionsHistoryItems
    GetSecretTypesDataItems:
      type: object
      properties:
        name:
          type: string
          description: The name of the secret type.
        id:
          type: string
          description: The ID of the secret type.
        type:
          $ref: '#/components/schemas/GetSecretTypesDataItemsType'
          description: 'The origin of the secret type:

            - `DEFAULT` — Supported by default in Postman.

            - `TEAM_REGEX` — A custom regex added by an Admin or Super Admin user in the **Configure Alerts** section of the [**Team Settings**](https://learning.postman.com/docs/administration/team-settings/) interface.

            '
      description: Information about the secret type.
      title: GetSecretTypesDataItems
    updateSecretResolutions:
      type: object
      properties:
        secretHash:
          type: string
          description: The SHA-256 hash of the detected secret.
        workspaceId:
          type: string
          description: The ID of the workspace that contains the secret.
        resolution:
          $ref: '#/components/schemas/UpdateSecretResolutionsResolution'
          description: 'The secret''s current resolution status:

            - `ACTIVE` — The secret is active.

            - `FALSE_POSITIVE` — The discovered secret is not an actual secret.

            - `REVOKED` — The secret is valid, but the user rotated their key to resolve the issue.

            - `ACCEPTED_RISK` — The Secret Scanner found the secret, but user accepts the risk of publishing it.

            '
        history:
          type: array
          items:
            $ref: '#/components/schemas/UpdateSecretResolutionsHistoryItems'
          description: The history of the secret's resolution status changes.
      title: updateSecretResolutions
    UpdateSecretResolutionsHistoryItemsResolution:
      type: string
      enum:
      - FALSE_POSITIVE
      - ACCEPTED_RISK
      - REVOKED
      - ACTIVE
      description: 'The secret''s updated resolution status:

        - `ACTIVE` — The secret is active.

        - `FALSE_POSITIVE` — The discovered secret is not an actual secret.

        - `REVOKED` — The secret is valid, but the user rotated their key to resolve the issue.

        - `ACCEPTED_RISK` — The Secret Scanner found the secret, but user accepts the risk of publishing it.

        '
      title: UpdateSecretResolutionsHistoryItemsResolution
    UpdateDetectedSecretResolutionsRequestForbiddenError:
      oneOf:
      - $ref: '#/components/schemas/commonErrorTypeTitleDetailStatus'
      - $ref: '#/components/schemas/commonErrorTypeTitleStatusInstance'
      title: UpdateDetectedSecretResolutionsRequestForbiddenError
    GetSecretsLocationsMetaActivityFeedItems:
      type: object
      properties:
        resolvedAt:
          type: string
          format: date-time
          description: The date and time at which the resolution status was last updated.
        resolvedBy:
          type: integer
          description: The ID of the user that updated the secret's resolution status.
        status:
          $ref: '#/components/schemas/GetSecretsLocationsMetaActivityFeedItemsStatus'
          description: 'The secret''s current resolution status:

            - `ACTIVE` — The secret is active.

            - `FALSE_POSITIVE` — The discovered secret is not an actual secret.

            - `REVOKED` — The secret is valid, but the user rotated their key to resolve the issue.

            - `ACCEPTED_RISK` — The Secret Scanner found the secret, but user accepts the risk of publishing it.

            '
      title: GetSecretsLocationsMetaActivityFeedItems
    DetectedSecretsQueriesDataItemsWorkspaceVisibility:
      type: string
      enum:
      - personal
      - private
      - team
      - public
      description: The workspace's [visibility setting](https://learning.postman.com/docs/collaborating-in-postman/using-workspaces/managing-workspaces/#changing-workspace-visibility).
      title: DetectedSecretsQueriesDataItemsWorkspaceVisibility
    UpdateSecretResolutionsResolution:
      type: string
      enum:
      - FALSE_POSITIVE
      - ACCEPTED_RISK
      - REVOKED
      - ACTIVE
      description: 'The secret''s current resolution status:

        - `ACTIVE` — The secret is active.

        - `FALSE_POSITIVE` — The discovered secret is not an actual secret.

        - `REVOKED` — The secret is valid, but the user rotated their key to resolve the issue.

        - `ACCEPTED_RISK` — The Secret Scanner found the secret, but user accepts the risk of publishing it.

        '
      title: UpdateSecretResolutionsResolution
    DetectedSecretsQueriesRequestWorkspaceVisibilitiesItems:
      type: string
      enum:

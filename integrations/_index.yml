# Postman integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in postman-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: postman-github
  label: Sync a Postman collection from a GitHub repository
  partner: github
  category: Source control
  use_case: On push to main in a GitHub repo, read the OpenAPI / collection JSON and update or fork the matching
    Postman collection so the design lives next to the code.
  source: curated
  status: not-a-workflow
  evidence: https://docs.github.com/en/code-security/reference/secret-security/supported-secret-scanning-patterns#supported-provider-patterns
  type: register
  arazzo: null
- slug: postman-gitlab
  label: Mirror Postman collections in a GitLab project
  partner: gitlab
  category: Source control
  use_case: On merge to the GitLab default branch, push the resolved OpenAPI into Postman as a versioned API schema
    so the GitLab project stays the source of truth.
  source: curated
  status: pending-generation
  arazzo: null
- slug: postman-bitbucket
  label: Publish Postman collection from a Bitbucket pipeline
  partner: bitbucket
  category: Source control
  use_case: A Bitbucket Pipelines build publishes the generated Postman collection through this capability so the
    collection version always matches the build artifact.
  source: curated
  status: pending-generation
  arazzo: null
- slug: postman-slack
  label: Post Postman monitor failures to a Slack channel
  partner: slack
  category: Notifications
  use_case: When a Postman monitor run reports failures, post a rich Slack alert with the failed assertions and
    a link back to the monitor run.
  evidence: https://zapier.com/apps/postman/integrations/slack
  type: marketplace
  source: curated
  status: pending-generation
  arazzo: null
- slug: postman-datadog
  label: Forward Postman monitor results to Datadog metrics
  partner: datadog
  category: Observability
  use_case: Translate each Postman monitor run into Datadog custom metrics and events so API health rolls up next
    to the rest of the platform's SLOs.
  source: curated
  status: not-a-workflow
  evidence: https://github.com/DataDog/integrations-extras/tree/master/postman
  type: marketplace
  arazzo: null
- slug: postman-spectral
  label: Lint Postman API schemas with Spectral on every change
  partner: spectral
  category: Governance
  use_case: When a Postman API schema is created or updated, run Spectral against it and write the violations back
    as comments on the API.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: postman-stoplight
  label: Cross-publish Postman collections to Stoplight projects
  partner: stoplight
  category: Governance
  use_case: Mirror Postman API schemas into a Stoplight project so design-time docs and runtime collections stay
    in lockstep.
  source: curated
  status: pending-generation
  arazzo: null
- slug: postman-microcks
  label: Promote a Postman mock server to a Microcks mock
  partner: microcks
  category: Mocking
  use_case: When a Postman mock is published, register the same collection as a Microcks mock so CI/CD environments
    can reuse one mock surface across teams.
  source: curated
  status: pending-generation
  arazzo: null
- slug: postman-bruno
  label: Import a Bruno collection into a Postman workspace
  partner: bruno
  category: Mocking
  use_case: Convert a Bruno (.bru) collection into Postman collection JSON and create the matching Postman collection
    so teams can move between the two clients.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: postman-asyncapi
  label: Register AsyncAPI specs as Postman API schemas
  partner: asyncapi
  category: Standards
  use_case: For each AsyncAPI document, create or update a corresponding Postman API record so async channels show
    up alongside REST collections in the catalog.
  source: curated
  status: pending-generation
  arazzo: null
- slug: postman-snyk
  label: Scan Postman-detected secrets with Snyk and open a fix issue
  partner: snyk
  category: Security
  use_case: When the Postman secret scanner finds a leaked secret, open a Snyk issue and resolve the detected secret
    in Postman once Snyk confirms remediation.
  source: curated
  status: pending-generation
  arazzo: null
- slug: postman-jira
  label: Open a Jira ticket for failing Postman monitors
  partner: jira
  category: Incident management
  use_case: When a Postman monitor fails its assertions, open a Jira issue in the on-call project with the run logs
    and a link back to the monitor.
  source: curated
  status: pending-generation
  arazzo: null
